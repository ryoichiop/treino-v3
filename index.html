<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3050">
<title>Treino — Hipertrofia v3</title>
<style>
  :root{
    --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EDF1F6; --line:#DBE1EA;
    --ink:#161E2C; --muted:#5C6879; --faint:#8A96A6;
    --navy:#1E3050; --navy-ink:#FFFFFF;
    --gold:#9A6B12; --gold-bg:#FBF1DC; --gold-line:#E6CF9B;
    --strength:#1F6B57; --strength-bg:#E1F0EB;
    --err:#B23A48;
    --radius:14px; --maxw:920px;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html{overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  input,img{max-width:100%}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:20px 16px 96px}
  a{color:var(--gold)} a:hover{text-decoration:underline}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

  .hd .eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .hd h1{font-size:clamp(1.5rem,4.4vw,2.05rem);line-height:1.1;margin:.25em 0 .3em;letter-spacing:-.01em}
  .hd p{color:var(--muted);margin:0;max-width:64ch;font-size:.94rem}
  .star{color:var(--gold)}

  .tabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:10px 16px;
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);scrollbar-width:thin}
  .tab{flex:0 0 auto;font-size:.85rem;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);
    padding:8px 15px;border-radius:999px;white-space:nowrap}
  .tab.is-active{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}

  .panel{padding-top:18px}
  .panel[hidden]{display:none}

  .golden{background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:var(--radius);padding:13px 16px;font-size:.92rem;margin-bottom:14px}
  .golden b{color:var(--gold)}
  .legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:14px}
  .lg{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}
  .lg h3{margin:0 0 4px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .lg p{margin:0;font-size:.86rem;color:var(--muted)} .lg b{color:var(--ink)}
  .pick{margin-top:6px;font-size:.95rem;color:var(--muted)} .pick b{color:var(--ink)}
  .daygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
  .daycard{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:12px;padding:12px 14px;color:var(--ink)}
  .daycard .n{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .daycard .t{display:block;font-weight:700;margin-top:2px;font-size:.95rem}

  .daybar{display:flex;align-items:baseline;gap:10px;background:var(--navy);color:var(--navy-ink);border-radius:12px;padding:12px 16px;margin-bottom:10px}
  .daybar .n{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.82;font-weight:700}
  .daybar h2{margin:0;font-size:1.04rem;font-weight:700}
  .daybar .sub{font-weight:400;opacity:.82;font-size:.92em}

  .modes{display:inline-flex;margin-bottom:12px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
  .mode{border:none;background:transparent;color:var(--muted);font-size:.8rem;font-weight:600;padding:7px 15px}
  .mode.is-active{background:var(--navy);color:var(--navy-ink)}
  .sessionbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:10px;font-weight:600;font-size:.9rem}
  .btn-primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
  .btn-save{background:var(--strength);color:#fff;border-color:var(--strength)}
  .sess-note{font-size:.85rem;color:var(--muted)}

  .ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;margin-bottom:11px}
  .ex.logging{border-color:var(--navy)}
  .ex__name{margin:0;font-size:1rem;font-weight:700;line-height:1.3}
  .badge{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;vertical-align:middle;
    padding:2px 6px;border-radius:5px;margin-left:5px;color:var(--strength);background:var(--strength-bg)}
  .badge.b{color:#6D4AAE;background:#ECE6F7}
  .ex__meta{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 0}
  .ex__sug{margin-top:8px;font-size:.78rem;line-height:1.45;color:var(--muted)}
  .ex__sug:empty{display:none}
  .ex__sug .sug__last{color:var(--ink);font-weight:600}
  .ex__sug .sug__ref{color:#2a6fb0;font-weight:600}
  .ex__sug .sug__adv{color:var(--gold);font-weight:700}
  .ex__sug b{color:var(--gold)}
  .ex__sug i{font-style:normal;color:var(--faint);font-weight:400}
  .ex__sug .sug__none{color:var(--faint)}
  .ex__sug .sug__plan{display:inline-block;font-size:.64rem;font-weight:700;background:#2a6fb0;color:#fff;border-radius:4px;padding:0 4px;margin:0 1px;vertical-align:1px;letter-spacing:.02em}
  .chip{display:inline-flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 9px}
  .chip .k{font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .chip .v{font-size:.9rem;font-weight:700;line-height:1.2}
  .ex__actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
  .ex__toggle{background:transparent;border:none;color:var(--gold);font-weight:600;font-size:.82rem;padding:0}
  .ex__how,.ex__anim,.ex__pq{margin-top:9px;font-size:.86rem;color:var(--muted)}
  .ex__how[hidden],.ex__anim[hidden],.ex__pq[hidden]{display:none}
  .ex__pq p{margin:9px 0;line-height:1.5}
  .ex__pq .lbl{display:block;margin-bottom:1px;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
  .lbl.why{color:var(--gold)}.lbl.mus{color:#2a6fb0}.lbl.tip{color:#0a7d3c}
  .loghead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .unitseg{display:inline-flex;margin-left:auto;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .unitseg .us{border:0;background:transparent;font:inherit;font-size:.72rem;font-weight:700;padding:3px 11px;color:var(--muted);cursor:pointer}
  .unitseg .us.is-active{background:var(--navy);color:var(--navy-ink)}
  .ex__how b{color:var(--ink)}
  .ex__how .lbl{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);
    background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;margin-right:6px}
  .ex__how .lbl.err{color:var(--err)} .ex__how .lbl.alt{color:var(--gold)}
  .ex__how ol{margin:8px 0;padding-left:0;list-style:none;counter-reset:st}
  .ex__how li{counter-increment:st;position:relative;padding:3px 0 3px 28px;color:var(--ink)}
  .ex__how li::before{content:counter(st);position:absolute;left:0;top:3px;width:19px;height:19px;border-radius:50%;background:var(--navy);color:#fff;font-size:.66rem;font-weight:800;display:grid;place-items:center}

  .anim{position:relative;width:100%;max-width:290px;margin:4px auto 0;aspect-ratio:1/1;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .22s ease}
  .anim .af--b{opacity:0}
  .ex__anim:not([hidden]) .anim .af--b{animation:frameflip 1.4s infinite}
  @keyframes frameflip{0%,49.9%{opacity:0}50%,100%{opacity:1}}
  .anim__cap{text-align:center;font-size:.72rem;color:var(--faint);margin:6px 0 0}
  .anim__loading{position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem;color:var(--faint)}

  .ex__log{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px}
  .ex__log[hidden]{display:none}
  .ex__log .loghead{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:7px}
  .setrow{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .setrow .setn{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);
    color:var(--muted);font-size:.7rem;font-weight:800;display:grid;place-items:center}
  .in{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:.95rem;color:var(--ink)}
  .in::placeholder{color:var(--faint)}
  .setrow .fld{flex:1 1 0;display:flex;align-items:center;gap:5px}
  .setrow .u{font-size:.78rem;color:var(--faint);flex:0 0 auto}
  .setrow .x{color:var(--faint);flex:0 0 auto}
  .addset{margin-top:2px;background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:.82rem;font-weight:600}
  .in-obs{display:block;width:100%;margin-top:9px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:.9rem;color:var(--ink);resize:vertical;min-height:42px}
  .in-obs::placeholder{color:var(--faint)}
  .ex-edit{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
  .ex-edit:first-of-type{border-top:none;padding-top:2px}
  .ee__name{font-weight:600;font-size:.9rem;margin-bottom:6px}
  .ee__datelbl{display:block;font-size:.8rem;color:var(--muted);margin-bottom:12px}
  .ee__date{font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin-left:6px;color:var(--ink)}
  .ee__actions{display:flex;gap:8px;margin-top:14px}

  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;justify-content:center}
  .savebar .info{font-size:.82rem;color:var(--muted);margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .savebar .btn{flex:0 0 auto}
  .savebar[hidden]{display:none}

  .histhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .histhead h2{margin:0;font-size:1.15rem;margin-right:auto}
  .sess{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .sess__top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .syncbadge{font-size:.68rem;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:999px;white-space:nowrap}
  .syncbadge.is-ok{color:#0a7d3c;background:rgba(16,160,72,.12)}
  .syncbadge.is-pending{color:#8a5a00;background:rgba(214,158,46,.16)}
  .sess__date{font-weight:700}
  .sess__day{font-size:.8rem;color:var(--muted)}
  .sess__edit{margin-left:auto;background:transparent;border:none;color:var(--gold);font-size:.8rem;font-weight:600}
  .sess__del{margin-left:10px;background:transparent;border:none;color:var(--faint);font-size:.8rem}
  .sess__line .obsnote{color:var(--faint);font-style:italic}
  .sess__line{font-size:.86rem;margin-top:5px}
  .sess__line .exn{font-weight:600}
  .sess__line .sk{color:var(--faint);font-style:italic}
  .empty{color:var(--muted);font-size:.9rem}

  .prog h2,.gloss h2{font-size:1.15rem;margin:0 0 4px} .prog>p,.gloss>p{color:var(--muted);font-size:.9rem;margin:0 0 14px;max-width:64ch}
  .ladder{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
  .ladder h3{margin:0 0 10px;font-size:.95rem;display:flex;align-items:center;gap:8px}
  .ladder h3 .t{font-size:.62rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--gold);background:var(--gold-bg);border:1px solid var(--gold-line);padding:2px 7px;border-radius:5px}
  .steps{display:flex;flex-wrap:wrap;gap:7px;list-style:none;margin:0;padding:0;counter-reset:s}
  .steps li{counter-increment:s;display:flex;align-items:center;gap:7px;font-size:.84rem;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 11px}
  .steps li::before{content:counter(s);display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--navy);color:#fff;font-size:.68rem;font-weight:800}
  .steps li:last-child{background:var(--gold-bg);border-color:var(--gold-line)} .steps li:last-child::before{background:var(--gold)}
  .gloss__grp{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:800;margin:18px 0 8px}
  .terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
  .term{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-left:3px solid var(--gold)}
  .term dt{font-weight:700;font-size:.9rem;margin-bottom:3px} .term dd{margin:0;font-size:.85rem;color:var(--muted)} .term dd b{color:var(--ink)}

  .toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal.show{display:flex}
  .modal__box{background:var(--surface);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:80vh;overflow:auto}
  .modal__box h3{margin:0 0 8px}
  .modal textarea{width:100%;height:300px;font:inherit;font-size:.8rem;border:1px solid var(--line);border-radius:8px;padding:10px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hd">
    <div class="eyebrow">Hipertrofia · braço + ombro · recomp</div>
    <h1>Treino</h1>
    <p>Toque num <b>dia</b>, aperte <b>▶ Iniciar treino</b> e registre séries, reps e carga. Cada exercício tem <b>Como fazer</b> e <b>Ver animação</b>. Deixe em branco o que pulou. <span class="star">★</span> = posição alongada.</p>
  </header>
  <nav class="tabs" id="tabs" aria-label="Seções"></nav>
  <main id="main"></main>
</div>
<div class="savebar" id="savebar" hidden>
  <span class="info" id="saveinfo"></span>
  <button class="btn" id="btnCancel">Cancelar</button>
  <button class="btn btn-save" id="btnSave">Salvar treino</button>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal__box"><h3>Copiar dados</h3><p class="empty">Selecione tudo e copie (Ctrl/Cmd+C):</p><textarea id="modalTxt" readonly></textarea><div style="margin-top:10px;text-align:right"><button class="btn" id="modalClose">Fechar</button></div></div></div>

<script>
(function(){
  "use strict";
  var S='<span class="star">★</span> ';
  var IMG='img/';
  var SYNC_URL='https://script.google.com/macros/s/AKfycbxjHJ74XwoSJ7pMLy5w7QRdiPG_lkKE3N5eGXpW0_u2HrvoZNk_Nvf5bWyAwGm-oKpf1w/exec';
  var SYNC_KEY='wk_treino_3fJ9pLxQ2m';

  var DAYS=[
   {id:'dia1',name:'Puxar + Braço',sub:'(braço fresco)',ex:[
    {id:'d1e1',pq:{pra:'Puxada vertical fresca é teu maior construtor de largura de dorsal (o V que falta) e ainda banca bíceps e braquial de graça — dois alvos teus num movimento só. Também é teu objetivo de barra livre.',mus:'Dorsal (direta, principal); bíceps e braquial (direta, como flexores do cotovelo); redondo maior e romboides (indireta).',srr:'4 séries, 2–3 RIR: é força e prática de padrão, então fica longe da falha pra manter qualidade de rep e progredir na assistência (hoje você trava em ~3 livres).',dica:'Comece cada rep encaixando a escápula pra baixo antes de dobrar o cotovelo; desça até esticar 100% — a parte alongada é onde a dorsal mais cresce.'},nm:'Barra fixa supinada (chin-up)',bd:'Força',sets:4,reps:'prog.',rir:'2–3',rest:'2–3 min',an:'Chin-Up',ap:'Barra fixa. Sem peso; elástico ou gráviton se precisar.',st:['Pegada supinada (palmas pra você), largura dos ombros.','Pendure com os braços esticados, ombros encaixados.','Puxe levando o peito à barra, cotovelos pra baixo.','Suba até o queixo passar; desça até esticar.'],er:'balançar (kipping); não descer até o fim.',alt:'Puxada supinada na máquina.'},
    {id:'d1e2',pq:{pra:'Espessura das costas (o meio que a puxada não pega) e mais volume indireto de bíceps. Completa o V por trás.',mus:'Dorsal, trapézio médio e romboides (direta); bíceps e braquial (indireta); eretores da lombar (estabilização).',srr:'3 × 8–12, 1–2 RIR: faixa de hipertrofia com carga que você controla sem roubar com a lombar.',dica:'Puxe levando o cotovelo pra trás (não pra cima) e aperte a escápula no fim; se a lombar começa a ceder, encerre a série.'},nm:'Remada curvada / cavalinho',sets:3,reps:'8–12',rir:'1–2',rest:'2 min',an:'Bent_Over_Barbell_Row',ap:'Barra ou máquina cavalinho.',st:['Tronco inclinado firme, coluna neutra.','Puxe os cotovelos pra trás, aperte a escápula.','Desça até os braços esticarem.'],er:'puxar só com o braço; arredondar a lombar.',alt:'Remada com halteres apoiado no banco.'},
    {id:'d1e3',pq:{pra:'Reforça a largura num ângulo mais controlável que a barra, com ênfase no alongamento da dorsal no topo.',mus:'Dorsal (direta, principal); redondo maior (direta); bíceps e braquial (indireta).',srr:'3 × 10–12, 1 RIR: isolamento relativo da dorsal, dá pra chegar mais perto da falha com segurança.',dica:'No topo deixe o ombro subir junto (alonga a dorsal) e puxe à parte alta do peito — nunca atrás da nuca, que é ruim pro teu ombro AC.'},nm:'Puxada alta (soltar no topo)',sets:3,reps:'10–12',rir:'1',rest:'90 s',an:'Full_Range-Of-Motion_Lat_Pulldown',ap:'Máquina de puxada + barra.',st:['No topo, deixe o ombro subir um pouco (alonga a dorsal).','Puxe à parte alta do peito, cotovelos pra baixo.','Controle a volta até o alongamento.'],er:'puxar atrás da nuca; balançar.',alt:'Barra fixa assistida.'},
    {id:'d1e4',pq:{pra:'Teu exercício número 1 de braquial: a pegada pronada é a que mais ativa o braquial, que engrossa o braço e empurra o pico do bíceps. É tua prioridade máxima.',mus:'Braquial e braquiorradial (direta, principal); bíceps (direta, menor); antebraço (indireta).',srr:'3 × 10–15, 0–1 RIR: músculo pequeno e resistente, responde a reps altas perto da falha; o cabo mantém tensão constante.',dica:'Punho firme e reto (não deixe cair) e cotovelo colado ao corpo; manter a palma pra baixo é o que direciona o estímulo pro braquial.'},nm:S+'Rosca inversa no cabo',bd:'Braquial',sets:3,reps:'10–15',rir:'0–1',rest:'75 s',an:'Reverse_Cable_Curl',ap:'Polia baixa + barra reta. Pegada pronada (palmas pra baixo).',st:['Pegada pronada, punho firme e reto.','Cotovelos colados ao corpo.','Suba sem deixar o punho cair; desça devagar.'],er:'quebrar o punho; usar impulso.',alt:'Rosca inversa com barra W.'},
    {id:'d1e5',pq:{pra:'Segundo martelo do braquial, pegada neutra — mesma meta de engrossar o braço, num padrão livre que complementa a inversa.',mus:'Braquial e braquiorradial (direta, principal); bíceps (direta, parcial).',srr:'3 × 10–15, 0–1 RIR: alta repetição perto da falha pro braquial.',dica:'Polegar pra cima o tempo todo; suba sem balançar o tronco e controle a descida — o braquial responde bem à fase negativa.'},nm:'Rosca martelo (neutra)',bd:'Braquial',sets:3,reps:'10–15',rir:'0–1',rest:'60 s',an:'Hammer_Curls',ap:'2 halteres, pegada neutra.',st:['Polegar pra cima (pegada de martelo).','Cotovelos fixos ao lado; suba mantendo a pegada.','Aperte em cima; desça controlado.'],er:'girar o punho; balançar.',alt:'Martelo no cabo com corda.'},
    {id:'d1e6',pq:{pra:'Aqui o bíceps é o alvo, alongado: no banco inclinado o braço fica atrás do corpo e estica a cabeça longa, a região que mais cresce com estiramento.',mus:'Bíceps, cabeça longa (direta, principal); braquial (indireta).',srr:'3 × 8–12, 0–1 RIR: faixa de hipertrofia; a posição alongada pede carga um pouco menor e controle.',dica:'Deixe os braços penderem atrás do corpo e não adiante o cotovelo; aperte 1 s em cima e desça até esticar total — o ganho está no fundo alongado.'},nm:S+'Rosca inclinada',bd:'Bíceps',sets:3,reps:'8–12',rir:'0–1',rest:'75 s',an:'Incline_Dumbbell_Curl',ap:'Banco inclinado 45–60° + halteres.',st:['Deixe os braços penderem atrás do corpo (alonga o bíceps).','Sem mexer o ombro, suba girando o punho.','Aperte 1 s; desça até esticar.'],er:'adiantar o cotovelo; não alongar.',alt:'Rosca Bayesian no cabo.'},
    {id:'d1e7',pq:{pra:'Teu trabalho pesado de quadríceps do dia; perna distribuída (1 por dia) mantém a coxa crescendo sem roubar recuperação do braço. Fica no fim, como você quer.',mus:'Quadríceps (direta, principal); glúteo e adutores (direta, parcial); posterior e core (estabilização).',srr:'3 × 6–10, 1–2 RIR: composto pesado, faixa de força-hipertrofia; mais longe da falha porque é exigente (teu SOD2 recupera devagar).',dica:'Desça até a coxa passar do paralelo (amplitude = crescimento); joelhos acompanham a ponta dos pés e podem passar dela — não encurte por mito.'},nm:'Agachamento hack ou livre',sets:3,reps:'6–10',rir:'1–2',rest:'2–3 min',an:'Hack_Squat',ap:'Hack (mais simples) ou barra no rack.',st:['Pés na largura dos ombros.','Desça até a coxa passar do paralelo.','Joelhos acompanham a ponta dos pés; suba sem travar.'],er:'descer pouco; joelho pra dentro.',alt:'Leg press profundo.'}
   ]},
   {id:'dia2',name:'Empurrar + Tríceps',sub:'',ex:[
    {id:'d2e1',pq:{pra:'Teu composto pesado de peito do dia; o inclinado prioriza a parte alta (a que mais falta pra moldar o peito) e banca um monte de tríceps de graça — empurrar alimenta teu braço. Halter desce mais fundo que a barra e é mais gentil com o ombro AC.',mus:'Peitoral superior (direta, principal); tríceps e deltoide anterior (direta, parcial); peito médio (indireta).',srr:'4 × 6–10, 1–2 RIR: é o movimento mais pesado do dia, então faixa de força-hipertrofia e longe da falha pra carregar carga com segurança no ombro.',dica:'Desça até sentir o peito alongar lá embaixo (sem socar no topo) — a fase alongada é a que mais cresce; cotovelos a ~45°, nunca abertos a 90°, pra poupar o AC.'},nm:S+'Supino inclinado halteres',sets:4,reps:'6–10',rir:'1–2',rest:'2–3 min',an:'Incline_Dumbbell_Press',ap:'Banco 30° + 2 halteres.',st:['Cotovelos a ~45° do tronco.','Desça buscando o alongamento do peito.','Empurre sem travar em cima.'],er:'descer pouco; travar no topo.',alt:'Supino inclinado na máquina.'},
    {id:'d2e2',pq:{pra:'Composto de empurrar que castiga tríceps e peito ao mesmo tempo — mais tríceps indireto pro teu braço. É progressão de peso corporal, igual à barra fixa.',mus:'Tríceps e peitoral inferior (direta, principal); deltoide anterior (direta, parcial).',srr:'3 séries até ~2–3 RIR: progride pelo peso corporal; pare antes de forçar o fundo pra não castigar o ombro.',dica:'Não desça além do braço passar de 90° — amplitude extra no fundo não compensa o estresse no ombro AC; tronco um pouco à frente pega mais peito.'},nm:'Paralela (dip)',bd:'Força',sets:3,reps:'prog.',rir:'2–3',rest:'2 min',an:'Parallel_Bar_Dip',ap:'Barras paralelas ou máquina assistida.',st:['Braços esticados, tronco levemente à frente.','Desça controlado até o braço passar de 90°.','Empurre até quase esticar.'],er:'descer demais; subir com impulso.',alt:'Dip assistido no gráviton ou no banco.'},
    {id:'d2e3',pq:{pra:'Delt lateral é o que dá a largura que emoldura o corpo e afina a cintura na ilusão do V. Não ajuda o braço (não cruza o cotovelo), mas é prioridade estética tua.',mus:'Deltoide lateral (direta, principal); deltoide anterior e trapézio (indireta).',srr:'3 × 12–20, 0–1 RIR: músculo pequeno que aguenta muita rep e tolera chegar perto da falha; o cabo mantém tensão desde embaixo.',dica:'Lidere com o cotovelo, não com a mão, e suba só até a altura do ombro — passar disso entrega o trabalho pro trapézio.'},nm:'Elevação lateral no cabo',sets:3,reps:'12–20',rir:'0–1',rest:'60 s',an:'Side_Lateral_Raise',ap:'Polia baixa + estribo (ou halteres). Supersérie com o face pull.',st:['De lado pra polia; suba lateralmente até a altura do ombro.','Desça devagar (a tensão já pega embaixo).'],er:'usar trapézio/impulso.',alt:'Halteres.'},
    {id:'d2e4',pq:{pra:'Seguro do teu ombro: fortalece o rotador externo e o posterior do delt, que equilibram todo o empurrar que você faz e protegem a articulação AC. Estética vem junto (postura e posterior cheio).',mus:'Deltoide posterior e rotadores externos (direta, principal); trapézio médio e romboides (direta, parcial).',srr:'3 × 15–20, 0–1 RIR: músculos posturais respondem a reps altas e contração mantida, não a carga pesada.',dica:'Puxe à altura das têmporas e gire os punhos pra fora no fim (polegar pra trás) — é a rotação externa que faz o exercício valer, não o peso.'},nm:'Face pull',sets:3,reps:'15–20',rir:'0–1',rest:'60 s',an:'Face_Pull',ap:'Polia na altura do rosto + corda. Saúde do ombro.',st:['Puxe as duas pontas em direção às têmporas.','Gire os punhos pra fora no fim; aperte a escápula.'],er:'cotovelos caídos pra baixo.',alt:'Elástico preso numa grade.'},
    {id:'d2e5',pq:{pra:'Aqui o alvo é a cabeça longa do tríceps — a maior, a que dá massa ao braço por trás. Com os braços pra trás da cabeça ela fica alongada, e músculo alongado cresce mais. É braço direto, tua prioridade.',mus:'Tríceps, cabeça longa (direta, principal); cabeças lateral e medial (direta, parcial).',srr:'3 × 8–12, 0–1 RIR: faixa de hipertrofia; a posição alongada pede controle, então segure a carga em vez de buscar PR.',dica:'Deixe a barra passar um pouco atrás da cabeça pra alongar de verdade e mantenha os cotovelos apontados pra frente, parados — eles abrindo tiram a carga do tríceps.'},nm:S+'Tríceps testa (atrás da cabeça)',sets:3,reps:'8–12',rir:'0–1',rest:'75 s',an:'Lying_Close-Grip_Barbell_Triceps_Extension_Behind_The_Head',ap:'Banco reto + barra W.',st:['Braços sobre o peito, inclinados um pouco pra trás.','Desça a barra à testa e um pouco atrás da cabeça.','Cotovelos fixos apontando pra frente; estenda.'],er:'cotovelos abrindo; mexer o ombro.',alt:'Testa com halteres ou corda deitado.'},
    {id:'d2e6',pq:{pra:'Fecha o tríceps na posição curta, complementando a testa (que pega o alongado). Reps altas pra bombear e acumular volume no braço sem estressar o ombro.',mus:'Tríceps, cabeças lateral e medial (direta, principal); cabeça longa (direta, parcial).',srr:'3 × 12–20 até a falha (0 RIR): isolamento seguro, dá pra ir até o fim sem risco.',dica:'Cotovelos colados ao corpo e afaste as pontas da corda no fim da extensão — essa abertura termina a contração; volte só até ~90°.'},nm:'Tríceps pushdown corda',sets:3,reps:'12–20',rir:'0',rest:'60 s',an:'Triceps_Pushdown_-_Rope_Attachment',ap:'Polia alta com corda.',st:['Cotovelos colados ao corpo.','Estenda pra baixo; afaste as pontas no fim.','Volte só até ~90°.'],er:'cotovelo saindo do corpo.',alt:'Pushdown com barra.'},
    {id:'d2e7',pq:{pra:'Entra no lugar do RDL pra poupar tua lombar e teu ombro AC, e ataca direto o glúteo — parte da cadeia posterior que teu histórico mostra quase não treinada. Fica no fim, como você quer a perna.',mus:'Glúteo máximo (direta, principal); posterior de coxa (direta, parcial); quadríceps e core (estabilização).',srr:'3 × 8–12, 1–2 RIR: o glúteo responde bem a essa faixa com pausa no topo; longe da falha porque carga alta no quadril cansa muito.',dica:'Pare de subir quando o tronco ficar paralelo ao chão e aperte o glúteo 1 s — passar disso você hiperestende a lombar; empurre pelo calcanhar, não pela ponta do pé.'},nm:'Elevação pélvica (hip thrust)',bd:'Glúteo',sets:3,reps:'8–12',rir:'1–2',rest:'2 min',an:'Barbell_Hip_Thrust',ap:'Barra sobre o quadril (use um pad) + banco nas costas.',st:['Escápulas apoiadas na borda do banco, barra na dobra do quadril, pés firmes na largura dos ombros.','Suba o quadril até o tronco ficar paralelo ao chão.','Aperte o glúteo 1 s no topo; desça controlado sem encostar o quadril no chão.'],er:'hiperestender a lombar no topo; empurrar na ponta do pé; subir pouco.',alt:'Elevação pélvica na máquina, ou glute bridge no chão.'},
    {id:'d2e8',pq:{pra:'Panturrilha é teimosa e você costuma pular — por isso está aqui com pausa no alongamento, que é o que a faz crescer. Em pé, com a perna reta, pega o gastrocnêmio (a parte que aparece).',mus:'Gastrocnêmio (direta, principal); sóleo (direta, parcial).',srr:'3 × 10–15, 0–1 RIR: aguenta reps e precisa de tensão no alongamento, não de peso insano com meia amplitude.',dica:'Desça o calcanhar o máximo e segure 1 s lá embaixo antes de subir na ponta — a pausa alongada vale mais que quicar com carga.'},nm:S+'Panturrilha em pé',sets:3,reps:'10–15',rir:'0–1',rest:'60 s',an:'Standing_Calf_Raises',ap:'Máquina de panturrilha em pé.',st:['Desça o calcanhar até o alongamento máximo (pausa 1 s).','Suba na ponta o mais alto possível.'],er:'quicar sem amplitude.',alt:'Panturrilha no leg press.'}
   ]},
   {id:'dia3',name:'Puxar + Braço',sub:'(variação)',ex:[
    {id:'d3e1',pq:{pra:'A pegada pronada joga mais carga na dorsal e menos no bíceps que a supinada — é teu construtor de largura número 1, o V que falta. Ainda alimenta bíceps e braquial de brinde.',mus:'Dorsal (direta, principal); redondo maior e romboides (direta, parcial); bíceps e braquial (indireta).',srr:'4 × progressão, 2–3 RIR: força e qualidade de rep; longe da falha porque você ainda progride na assistência (trava em poucas livres).',dica:'Puxe pensando em levar o cotovelo pro bolso, não a mão pra barra, e desça até esticar 100% — a dorsal cresce no fundo alongado.'},nm:'Barra fixa pronada (pull-up)',bd:'Força',sets:4,reps:'prog.',rir:'2–3',rest:'2–3 min',an:'Pullups',ap:'Barra fixa (elástico/gráviton se precisar).',st:['Palmas pra fora (pronada), mais aberto que os ombros.','Puxe o peito à barra, cotovelos ao quadril.','Suba até o queixo passar; desça até esticar.'],er:'meia amplitude; balanço.',alt:'Puxada alta pronada.'},
    {id:'d3e2',pq:{pra:'Espessura das costas (o meio, que a puxada vertical não pega) e mais volume indireto de bíceps. Largura você faz na barra; aqui é profundidade.',mus:'Dorsal, trapézio médio e romboides (direta, principal); bíceps e braquial (indireta); eretores (estabilização).',srr:'3 × 10–12, 1 RIR: faixa de hipertrofia com carga controlada e tensão constante do cabo.',dica:'Puxe ao abdômen com o tronco parado (não reclina pra roubar) e deixe a escápula alongar bem na frente antes de puxar de novo.'},nm:'Remada baixa no cabo',sets:3,reps:'10–12',rir:'1',rest:'90 s',an:'Seated_Cable_Rows',ap:'Polia baixa + triângulo.',st:['Tronco ereto; puxe ao abdômen, aperte a escápula.','Volte deixando alongar à frente.'],er:'reclinar o tronco pra puxar.',alt:'Remada na máquina.'},
    {id:'d3e3',pq:{pra:'Isola a dorsal sem o bíceps entrar — raro e útil pra quem quer largura. Trabalha a dorsal bem alongada, o ângulo que a puxada não enfatiza.',mus:'Dorsal (direta, principal); redondo maior e peitoral inferior (direta, parcial); tríceps, cabeça longa (indireta).',srr:'3 × 12–15, 1 RIR: isolamento, reps mais altas pra sentir a dorsal; o cabo mantém tensão no alongamento.',dica:'Mantenha o cotovelo quase reto e fixo o tempo todo — se dobrar, vira pushdown de tríceps; sinta a dorsal esticar lá em cima antes de puxar.'},nm:S+'Pullover na polia (dorsal)',sets:3,reps:'12–15',rir:'1',rest:'75 s',an:'Straight-Arm_Pulldown',ap:'Polia alta + barra reta.',st:['Em pé, braços quase esticados à frente/acima.','Puxe a barra até as coxas mantendo o cotovelo quase reto.','Sinta a dorsal alongar no topo.'],er:'dobrar muito o cotovelo (vira pushdown).',alt:'Pullover com halter no banco.'},
    {id:'d3e4',pq:{pra:'Variação de martelo que ataca braquial e braquiorradial por um ângulo cruzado — teu alvo de engrossar o braço, num estímulo diferente do Dia 1 pra não repetir.',mus:'Braquial e braquiorradial (direta, principal); bíceps (direta, parcial).',srr:'3 × 10–15, 0–1 RIR: músculo pequeno e resistente, responde a reps altas perto da falha.',dica:'Leve o halter cruzando pro ombro oposto com o cotovelo colado e parado; a descida lenta é onde o braquial mais trabalha.'},nm:S+'Rosca cross-body (martelo cruzado)',bd:'Braquial',sets:3,reps:'10–15',rir:'0–1',rest:'60 s',an:'Cross_Body_Hammer_Curl',ap:'Halteres, pegada neutra.',st:['Leve o halter cruzando em direção ao ombro oposto.','Cotovelo fixo ao lado do corpo.','Desça devagar; alterne os braços.'],er:'abrir o cotovelo; usar o tronco.',alt:'Cross-body no cabo.'},
    {id:'d3e5',pq:{pra:'Entrou no lugar do scott, que te dava dor no ombro. Com o cabo atrás do corpo o braço fica estendido e estica a cabeça longa do bíceps — a região que mais cresce com alongamento — sem o ombro travado do banco scott.',mus:'Bíceps, cabeça longa (direta, principal); braquial (indireta).',srr:'3 × 10–12, 0–1 RIR: faixa de hipertrofia; a posição alongada pede controle e tensão constante, que o cabo entrega.',dica:'Deixe o cotovelo um pouco atrás do corpo e não o adiante ao subir; volte devagar até sentir o bíceps esticar — o ganho está no fundo.'},nm:S+'Rosca bayesian (cabo)',bd:'Bíceps',sets:3,reps:'10–12',rir:'0–1',rest:'75 s',an:'Incline_Dumbbell_Curl',ap:'Polia baixa atrás do corpo + estribo. Ombro estendido e livre — substitui o scott (que te dava dor no ombro).',st:['De costas pra polia baixa, braço um pouco atrás do corpo (alonga a cabeça longa do bíceps).','Sem adiantar o ombro, flexione o cotovelo subindo o punho.','Aperte 1 s; volte devagar até o bíceps alongar.'],er:'adiantar o cotovelo/ombro; usar impulso.',alt:'Rosca inclinada no banco (mesma ideia com halteres).'},
    {id:'d3e6',pq:{pra:'Posterior de coxa, que teu histórico mostra atrasado. A versão sentada deixa o quadril flexionado, o que alonga mais o posterior e dá mais crescimento que a flexora deitada. Fica no fim, como você quer a perna.',mus:'Posterior de coxa — isquiotibiais (direta, principal); panturrilha (indireta).',srr:'3 × 10–15, 0–1 RIR: isolamento, dá pra ir perto da falha com segurança; a posição alongada favorece reps controladas.',dica:'Deixe o quadril bem encaixado no apoio (não deixe subir) e aperte 1 s na flexão máxima; a vantagem toda é o posterior começar alongado.'},nm:S+'Flexora sentada',sets:3,reps:'10–15',rir:'0–1',rest:'75 s',an:'Seated_Leg_Curl',ap:'Cadeira flexora sentada.',st:['Quadril flexionado (posição alongada).','Flexione o joelho ao máximo; aperte 1 s.','Volte controlado.'],er:'quadril saindo; amplitude curta.',alt:'Flexora deitada.'}
   ]},
   {id:'dia4',name:'Empurrar + Ombro + Braço',sub:'',ex:[
    {id:'d4e1',pq:{pra:'Peito no ângulo reto pra espessura geral, com tríceps de brinde — empurrar alimenta teu braço. Halter desce mais fundo que a barra e poupa o ombro AC.',mus:'Peitoral (direta, principal); tríceps e deltoide anterior (direta, parcial).',srr:'3 × 8–12, 1 RIR: faixa de hipertrofia; carga que você controla sem forçar o fundo com o ombro.',dica:'Cotovelos a ~45°, não abertos a 90°, e desça até o peito alongar — o alongamento manda no crescimento e protege o AC.'},nm:S+'Supino reto halteres',sets:3,reps:'8–12',rir:'1',rest:'2 min',an:'Dumbbell_Bench_Press',ap:'Banco reto + 2 halteres.',st:['Cotovelos a ~45°; desça buscando alongamento.','Empurre controlado sem travar.'],er:'cotovelos a 90°; descer pouco.',alt:'Supino na máquina.'},
    {id:'d4e2',pq:{pra:'Dia de maior volume de delt lateral — a largura de ombro que emoldura o físico e afina a cintura na ilusão. Estética pura, tua prioridade visual junto do braço.',mus:'Deltoide lateral (direta, principal); deltoide anterior e trapézio (indireta).',srr:'4 × 12–20, 0–1 RIR: músculo pequeno, tolera volume e reps altas perto da falha; por isso 4 séries hoje.',dica:'Lidere com o cotovelo e suba só até a linha do ombro; no cabo a tensão já pega lá embaixo, então controle a descida em vez de deixar cair.'},nm:S+'Elevação lateral',sets:4,reps:'12–20',rir:'0–1',rest:'60 s',an:'Side_Lateral_Raise',ap:'Halteres ou cabo. Volume alto hoje.',st:['Suba até a altura do ombro.','Desça devagar; a tensão pega já embaixo no cabo.'],er:'usar impulso; subir acima do ombro.',alt:'No cabo, um braço de cada vez.'},
    {id:'d4e3',pq:{pra:'Único empurrar vertical da semana, e de propósito leve e na máquina: o delt anterior já pega bastante no supino, e o overhead pesado é justo o que irrita teu ombro AC. Aqui é dose mínima, amplitude confortável.',mus:'Deltoide anterior (direta, principal); tríceps e deltoide lateral (direta, parcial).',srr:'2 × 10–12, 2 RIR: só 2 séries e bem longe da falha — é complemento, não o prato principal; se o ombro reclamar, pule.',dica:'Não force a amplitude lá em cima: pare onde o ombro fica confortável. Dor no AC = troca essas 2 séries por mais uma de elevação lateral.'},nm:'Desenvolvimento na máquina',sets:2,reps:'10–12',rir:'2',rest:'90 s',an:'Leverage_Shoulder_Press',ap:'Máquina de desenvolvimento.',st:['Mãos na altura das orelhas.','Empurre até quase esticar; desça controlado.','Amplitude confortável (não force).'],er:'arquear a lombar; forçar além do confortável.',alt:'Dor no ombro = pular e fazer mais uma série de elevação lateral.'},
    {id:'d4e4',pq:{pra:'Martelo no banco inclinado: o braço pende atrás do corpo e alonga, combinando a pegada neutra (braquial) com a posição esticada. Teu alvo de engrossar o braço no ângulo mais vantajoso.',mus:'Braquial e braquiorradial (direta, principal); bíceps (direta, parcial).',srr:'3 × 10–15, 0–1 RIR: braquial responde a reps altas perto da falha; a posição alongada pede controle.',dica:'Não adiante o cotovelo ao subir e controle a descida até o braço esticar — o braquial castiga de verdade na fase negativa longa.'},nm:S+'Rosca martelo inclinada',bd:'Braquial',sets:3,reps:'10–15',rir:'0–1',rest:'60 s',an:'Incline_Hammer_Curls',ap:'Banco inclinado + halteres, pegada neutra.',st:['Braços pendem atrás do corpo (alonga).','Suba em pegada neutra, sem mexer o ombro.','Aperte; desça até esticar.'],er:'adiantar o cotovelo.',alt:'Martelo em pé.'},
    {id:'d4e5',pq:{pra:'Fecha o tríceps com reps altas pra acumular volume no braço depois do supino, sem carga no ombro. Braço direto, teu foco.',mus:'Tríceps, cabeças lateral e medial (direta, principal); cabeça longa (direta, parcial).',srr:'3 × 12–20 até a falha: isolamento seguro, pode ir até o fim.',dica:'Cotovelos colados e abra as pontas da corda no fim da extensão; volte só até ~90° pra manter tensão.'},nm:'Tríceps corda (pushdown)',sets:3,reps:'12–20',rir:'0',rest:'60 s',an:'Triceps_Pushdown_-_Rope_Attachment',ap:'Polia alta com corda.',st:['Cotovelos colados; empurre e afaste as pontas no fim.','Volte até ~90°.'],er:'cotovelo saindo do corpo.',alt:'Pushdown com barra.'},
    {id:'d4e6',pq:{pra:'Quadríceps isolado pra fechar a coxa do dia (perna distribuída, 1 por dia, no fim, como você quer). Dá pra ir perto da falha sem o cansaço sistêmico do agachamento.',mus:'Quadríceps, as quatro cabeças (direta, principal), com destaque pro reto femoral.',srr:'3 × 12–15, 0–1 RIR: isolamento seguro, reps mais altas pra poupar o joelho e ainda somar volume.',dica:'Aperte 1 s no topo e, se quiser um extra, faça algumas parciais só na parte alongada (embaixo) no fim da série — é onde o quadríceps mais responde.'},nm:'Cadeira extensora',sets:3,reps:'12–15',rir:'0–1',rest:'75 s',an:'Leg_Extensions',ap:'Cadeira extensora.',st:['Estenda até o topo; aperte 1 s.','Desça controlado; parciais alongadas no fim, se quiser.'],er:'dar tranco; soltar na volta.',alt:'—'},

   {id:'dia5',name:'Peito + Costas + Ombro + Braço',sub:'(pump)',ex:[
    {id:'d5e1',pq:{pra:'Dia de bombear: o crucifixo isola o peito na posição alongada (braços abertos), que é a que mais cresce, sem o tríceps entrar. Fecha a semana de peito sem estressar o ombro como o supino pesado.',mus:'Peitoral (direta, principal); deltoide anterior (direta, parcial).',srr:'3 × 12–15, 0–1 RIR: isolamento de bombeamento, reps altas e perto da falha.',dica:'Abra até sentir o peito esticar (sem forçar atrás da linha do ombro, pelo AC) e feche sem socar — aperte 1 s no meio.'},nm:S+'Crucifixo / peck deck',sets:3,reps:'12–15',rir:'0–1',rest:'60 s',an:'Butterfly',ap:'Máquina voador (ou halteres deitado).',st:['Braços quase esticados; abra até alongar o peito.','Feche sem socar; aperte 1 s.'],er:'dobrar muito o cotovelo.',alt:'Crucifixo com halteres.'},
    {id:'d5e2',pq:{pra:'Mais volume de dorsal pro V, agora na máquina (braço já cansado do pump), com foco em sentir o alongamento no topo. Largura é teu ponto atrasado.',mus:'Dorsal (direta, principal); redondo maior e romboides (direta, parcial); bíceps e braquial (indireta).',srr:'3 × 10–15, 1 RIR: faixa de hipertrofia; a máquina deixa chegar perto da falha com segurança no fim do treino.',dica:'Deixe o ombro subir um pouco no topo pra alongar a dorsal e puxe à parte alta do peito — nunca atrás da nuca, ruim pro ombro.'},nm:'Puxada na máquina',sets:3,reps:'10–15',rir:'1',rest:'75 s',an:'Full_Range-Of-Motion_Lat_Pulldown',ap:'Máquina de puxada.',st:['Alongue a dorsal no topo.','Puxe à parte alta do peito.'],er:'puxar atrás da nuca.',alt:'Remada na máquina.'},
    {id:'d5e3',pq:{pra:'Mais largura de ombro, em reps altas de bombeamento. Terceira dose de delt lateral na semana porque é prioridade estética e o músculo aguanta volume alto.',mus:'Deltoide lateral (direta, principal); deltoide anterior e trapézio (indireta).',srr:'3 × 15–20, 0–1 RIR: reps altas pra encher o ombro, perto da falha.',dica:'Lidere com o cotovelo, suba só à altura do ombro e desça devagar; em supersérie com o crucifixo inverso o ombro fica trabalhado por todos os lados.'},nm:S+'Elevação lateral',sets:3,reps:'15–20',rir:'0–1',rest:'60 s',an:'Side_Lateral_Raise',ap:'Cabo ou halteres. Supersérie com o crucifixo inverso.',st:['Suba até a altura do ombro; desça devagar.'],er:'impulso.',alt:'Halteres.'},
    {id:'d5e4',pq:{pra:'Delt posterior, o lado que o espelho esconde e que quase ninguém treina — mas é ele que dá o ombro redondo visto de lado e equilibra tanto empurrar. Estética e saúde de ombro juntas.',mus:'Deltoide posterior (direta, principal); trapézio médio e romboides (direta, parcial).',srr:'3 × 15–20 até a falha: músculo pequeno e postural, pede reps altas e contração mantida.',dica:'Abra levando os cotovelos pra trás e pra fora, não ao quadril — se o cotovelo cai, vira remada e a dorsal rouba o trabalho.'},nm:'Crucifixo inverso (ombro posterior)',sets:3,reps:'15–20',rir:'0',rest:'60 s',an:'Reverse_Machine_Flyes',ap:'Peck deck invertido ou halteres inclinado.',st:['Abra levando os cotovelos pra trás/fora.','Aperte o posterior do ombro; volte controlado.'],er:'usar a dorsal (cotovelo ao quadril).',alt:'Crucifixo inverso com halteres.'},
    {id:'d5e5',pq:{pra:'Fecha o braço do dia atacando o braquial — teu alvo pra engrossar o braço — com pegada neutra. Entrou no lugar do Zottman, que você não curtiu; o cabo dá tensão constante, ideal pra finalizar no pump.',mus:'Braquial e braquiorradial (direta, principal); bíceps (direta, parcial).',srr:'3 × 10–15 até a falha: músculo pequeno e resistente, reps altas perto da falha; o cabo segura a tensão do começo ao fim.',dica:'Cotovelos colados e parados ao lado do corpo — só o antebraço se move; controle a descida até esticar, que é onde o braquial mais trabalha.'},nm:'Rosca martelo no cabo (corda)',bd:'Braquial',sets:3,reps:'10–15',rir:'0',rest:'60 s',an:'Cable_Hammer_Curls_-_Rope_Attachment',ap:'Polia baixa + corda, pegada neutra (palmas frente a frente).',st:['Em pé de frente pra polia baixa, segure a corda em pegada neutra, braços esticados.','Cotovelos colados e parados; suba a corda até a altura dos ombros.','Aperte 1 s no topo; desça controlado até esticar.'],er:'balançar o tronco; cotovelo saindo do corpo.',alt:'Rosca martelo com halteres (mesma pegada).'},
    {id:'d5e6',pq:{pra:'Fecha o tríceps da semana pela cabeça longa, alongada atrás da cabeça — a maior cabeça, a que dá massa ao braço. Braço direto, teu foco, em reps de bombeamento.',mus:'Tríceps, cabeça longa (direta, principal); cabeças lateral e medial (direta, parcial).',srr:'3 × 10–15 até a falha: isolamento, reps mais altas pra fechar o braço sem estressar o ombro.',dica:'Deixe a barra passar um pouco atrás da cabeça pra alongar e mantenha os cotovelos parados, apontados pra frente — eles abrindo tiram a carga do tríceps.'},nm:'Tríceps testa',sets:3,reps:'10–15',rir:'0',rest:'60 s',an:'Lying_Close-Grip_Barbell_Triceps_Extension_Behind_The_Head',ap:'Banco reto + barra W (ou corda deitado).',st:['Desça a barra à testa e um pouco atrás da cabeça.','Cotovelos fixos; estenda de volta.'],er:'cotovelos abrindo.',alt:'Tríceps corda.'},
    {id:'d5e7',pq:{pra:'Composto de perna pra fechar a semana (perna distribuída, 1 por dia, sempre no fim). O leg press carrega bastante quadríceps e glúteo sem exigir equilíbrio nem castigar a lombar no fim do treino.',mus:'Quadríceps (direta, principal); glúteo e adutores (direta, parcial); posterior (estabilização).',srr:'3 × 10–15, 1 RIR: composto no fim do treino, reps médias-altas; longe da falha porque você já está cansado (SOD2 recupera devagar).',dica:'Desça até quase encostar os joelhos no peito, mas sem a lombar sair do apoio — essa amplitude é o que faz a perna crescer; não trave o joelho em cima.'},nm:'Leg press',sets:3,reps:'10–15',rir:'1',rest:'90 s',an:'Leg_Press',ap:'Leg press.',st:['Quadril e lombar apoiados.','Desça até quase encostar os joelhos no peito, sem tirar o quadril.','Empurre sem travar.'],er:'quadril saindo no fundo.',alt:'Agachamento.'},
    {id:'d5e8',pq:{pra:'Fortalece a lombar, o glúteo e o posterior — a cadeia posterior que teu histórico mostra quase não treinada e que protege tua coluna em tudo que você puxa e agacha. Base de saúde, não só estética.',mus:'Eretores da espinha (direta, principal); glúteo e posterior de coxa (direta, parcial).',srr:'3 × 12–20, 1–2 RIR: músculos posturais respondem a reps altas e controle; longe da falha porque é a tua lombar.',dica:'Desça dobrando o quadril (não enrole a coluna) e suba só até alinhar o tronco, apertando glúteo e abdômen — não hiperestenda pra trás.'},nm:'Extensão de lombar (back extension)',sets:3,reps:'12–20',rir:'1–2',rest:'90 s',an:'Hyperextensions_Back_Extensions',ap:'Banco de hiperextensão (romana).',st:['Apoio das coxas logo abaixo do quadril.','Desça dobrando o quadril (não force a lombar).','Suba até alinhar o tronco; aperte glúteo e abdômen.'],er:'hiperestender a lombar; usar impulso.',alt:'No chão (superman).'}
   ]}

   dia1:[

    {id:'d2b4',pq:{pra:'Delt posterior, o lado escondido que dá o ombro redondo de perfil e equilibra todo o empurrar — estética e saúde de ombro juntas.',mus:'Deltoide posterior (direta, principal); trapézio médio e romboides (direta, parcial).',srr:'3 × 15–20, 0–1 RIR: músculo postural, pede reps altas e contração mantida.',dica:'Abra levando os cotovelos pra trás e pra fora até a linha dos ombros; se puxar ao quadril vira remada e a dorsal rouba.'},nm:'Crucifixo inverso com halteres',sets:3,reps:'15–20',rir:'0–1',rest:'60 s',an:'Reverse_Flyes',ap:'2 halteres, tronco inclinado à frente.',st:['Tronco à frente, braços pendurados com leve flexão de cotovelo.','Abra levando os cotovelos pra trás/fora até a linha dos ombros.','Aperte o posterior do ombro; volte controlado.'],er:'puxar ao quadril (vira remada); balançar.',alt:'Peito apoiado num banco inclinado.'},
    {id:'d2b5',pq:{pra:'Alvo na cabeça longa do tríceps, a maior, que dá massa por trás do braço. Deitado com os halteres indo às orelhas ela trabalha alongada — e alongado cresce mais. Braço direto, tua prioridade.',mus:'Tríceps, cabeça longa (direta, principal); lateral e medial (direta, parcial).',srr:'3 × 8–12, 0–1 RIR: faixa de hipertrofia; a posição alongada pede controle da carga.',dica:'Flexione só o cotovelo, mantendo-o parado e apontado pra frente; o ombro parado é o que mantém a tensão no tríceps.'},nm:S+'Tríceps testa com halteres',sets:3,reps:'8–12',rir:'0–1',rest:'75 s',an:'Lying_Dumbbell_Tricep_Extension',ap:'Banco + 2 halteres.',st:['Deitado, halteres sobre o peito, palmas frente a frente.','Desça flexionando só o cotovelo em direção às orelhas.','Cotovelos parados apontando pra frente; estenda.'],er:'abrir os cotovelos; mexer o ombro.',alt:'Francês sentado com 1 halter, se o ombro deixar.'},
    {id:'d2b6',pq:{pra:'Fecha o tríceps na posição curta, complementando a testa (que pega o alongado). Reps altas pra bombear o braço sem carga no ombro.',mus:'Tríceps, cabeças lateral e medial (direta, principal); cabeça longa (direta, parcial).',srr:'3 × 12–20 até a falha: isolamento leve, pode ir ao fim.',dica:'Deixe o cotovelo alto e colado, parado, e estenda o antebraço até o braço ficar reto; aperte 1 s no topo — a contração final é tudo aqui.'},nm:'Tríceps coice (kickback) com halter',sets:3,reps:'12–20',rir:'0',rest:'60 s',an:'Tricep_Dumbbell_Kickback',ap:'1 halter + apoio (banco ou mão na coxa).',st:['Tronco inclinado, cotovelo alto e colado, dobrado a 90°.','Estenda o antebraço pra trás até o braço ficar reto; aperte.','Volte devagar aos 90°.'],er:'deixar o cotovelo cair; mexer o ombro.',alt:'Os dois braços juntos, tronco apoiado no banco.'},
    {id:'d2b7',pq:{pra:'No lugar do RDL, pra poupar lombar e ombro AC, atacando direto o glúteo — cadeia posterior que teu histórico mostra quase não treinada. Fica no fim, como você quer a perna.',mus:'Glúteo máximo (direta, principal); posterior de coxa (direta, parcial); quadríceps e core (estabilização).',srr:'3 × 10–15, 1–2 RIR: glúteo responde bem a essa faixa com pausa no topo; longe da falha porque carga no quadril cansa muito.',dica:'Suba só até o tronco ficar paralelo ao chão e aperte o glúteo 1 s — passar disso hiperestende a lombar; empurre pelo calcanhar.'},nm:'Elevação pélvica com halter',bd:'Glúteo',sets:3,reps:'10–15',rir:'1–2',rest:'90 s',an:'Barbell_Hip_Thrust',ap:'1 halter sobre o quadril + banco (ou glute bridge no chão).',st:['Escápulas na borda do banco, halter seguro na dobra do quadril, pés firmes.','Suba o quadril até o tronco paralelo ao chão; aperte o glúteo 1 s.','Desça controlado sem encostar no chão.'],er:'hiperestender a lombar; subir na ponta do pé.',alt:'Glute bridge no chão (sem banco), peso do corpo ou halter no quadril.'},
    {id:'d2b8',pq:{pra:'Panturrilha teimosa que você pula — aqui com pausa no alongamento, que é o que a faz crescer. Em pé, perna reta, pega o gastrocnêmio (a parte que aparece).',mus:'Gastrocnêmio (direta, principal); sóleo (direta, parcial).',srr:'3 × 10–15, 0–1 RIR: aguenta reps e precisa de tensão no alongamento, não de meia amplitude.',dica:'Desça o calcanhar o máximo e segure 1 s antes de subir na ponta; a pausa alongada vale mais que quicar.'},nm:S+'Panturrilha em pé com halteres',sets:3,reps:'10–15',rir:'0–1',rest:'60 s',an:'Standing_Dumbbell_Calf_Raise',ap:'2 halteres, ponta do pé num step/anilha.',st:['Desça o calcanhar até alongar (pausa 1 s).','Suba na ponta o mais alto possível.'],er:'quicar sem amplitude.',alt:'Uma perna de cada vez, segurando 1 halter.'}
   ],
   dia3:[
    {id:'d3b1',pq:{pra:'Remada com o peito apoiado no banco: tira a lombar da jogada e deixa focar 100% nas costas e no bíceps indireto. Espessura limpa, sem roubar.',mus:'Dorsal, trapézio médio e romboides (direta, principal); bíceps e braquial (indireta).',srr:'4 × 8–12, 1 RIR: hipertrofia; o apoio deixa chegar perto da falha com técnica.',dica:'Não tire o peito do apoio pra puxar — se precisar roubar, a carga está alta; puxe os cotovelos pra trás e aperte a escápula.'},nm:'Remada com 2 halteres (peito apoiado)',sets:4,reps:'8–12',rir:'1',rest:'90 s',an:'Bent_Over_Two-Dumbbell_Row',ap:'2 halteres + banco inclinado 30–45°.',st:['Peito apoiado no banco inclinado, halteres pendurados.','Puxe os cotovelos pra trás, aperte as escápulas.','Desça até esticar (o apoio evita roubar com o tronco).'],er:'tirar o peito do apoio; puxar só com o braço.',alt:'Remada curvada 2 halteres em pé.'},
    {id:'d3b2',pq:{pra:'Um lado por vez pra corrigir diferença entre os lados e puxar pesado com o apoio. Espessura de costas e bíceps indireto.',mus:'Dorsal, trapézio médio e romboides (direta, principal); bíceps e braquial (indireta).',srr:'3 × 10–12, 1 RIR: hipertrofia controlada; o apoio protege a lombar.',dica:'Puxe o cotovelo ao quadril sem girar o tronco; aperte a escápula no topo e desça até esticar o braço.'},nm:'Remada unilateral (serrote)',sets:3,reps:'10–12',rir:'1',rest:'75 s',an:'One-Arm_Dumbbell_Row',ap:'1 halter + banco.',st:['Mão e joelho apoiados no banco, tronco paralelo ao chão.','Puxe o halter ao quadril, cotovelo rente ao corpo; aperte a escápula.','Desça até esticar; troque de lado.'],er:'girar o tronco; puxar com o bíceps.',alt:'Em pé, tronco inclinado.'},
    {id:'d3b3',pq:{pra:'Isola a dorsal no alongamento profundo, sem o bíceps dominar — ótimo pra largura, teu ponto atrasado, atacado de novo pra somar volume na semana.',mus:'Dorsal (direta, principal); redondo maior e peitoral inferior (direta, parcial); tríceps, cabeça longa (indireta).',srr:'3 × 12–15, 1 RIR: isolamento, reps altas pra sentir a dorsal.',dica:'Cotovelo quase reto e fixo; leve o halter pra trás da cabeça até a dorsal esticar — dobrar o cotovelo transfere pro tríceps.'},nm:S+'Pullover com halter',sets:3,reps:'12–15',rir:'1',rest:'75 s',an:'Straight-Arm_Dumbbell_Pullover',ap:'1 halter + banco.',st:['Deitado, 1 halter com as duas mãos sobre o peito.','Leve pra trás da cabeça até alongar a dorsal; braços quase retos.','Volte controlado.'],er:'dobrar o cotovelo; arquear a lombar.',alt:'Quadris apoiados no banco.'},
    {id:'d3b4',pq:{pra:'Martelo cruzado ataca braquial e braquiorradial por um ângulo diferente — teu alvo de engrossar o braço, variado pra não repetir o estímulo do Dia 1.',mus:'Braquial e braquiorradial (direta, principal); bíceps (direta, parcial).',srr:'3 × 10–15, 0–1 RIR: músculo pequeno e resistente, reps altas perto da falha.',dica:'Leve o halter cruzando pro ombro oposto, cotovelo colado e parado; a descida lenta é onde o braquial mais trabalha.'},nm:S+'Rosca cross-body (martelo cruzado)',bd:'Braquial',sets:3,reps:'10–15',rir:'0–1',rest:'60 s',an:'Cross_Body_Hammer_Curl',ap:'Halteres, pegada neutra.',st:['Leve o halter cruzando em direção ao ombro oposto.','Cotovelo fixo ao lado do corpo; desça devagar; alterne.'],er:'abrir o cotovelo; usar o tronco.',alt:'Martelo normal, se preferir.'},
    {id:'d3b5',pq:{pra:'Rosca concentrada pelo pico do bíceps — a contração máxima no topo. Variação que complementa o alongamento do Dia 1 com ênfase no encurtado.',mus:'Bíceps, com ênfase no pico (direta, principal); braquial (indireta).',srr:'3 × 10–12, 0–1 RIR: isolamento estrito, dá pra ir perto da falha apertando bem o topo.',dica:'Cotovelo fixo na coxa, sem tirar; aperte 1 s no topo e desça devagar até esticar — a ideia aqui é a contração, não a carga.'},nm:'Rosca concentrada (pico)',bd:'Bíceps',sets:3,reps:'10–12',rir:'0–1',rest:'60 s',an:'Concentration_Curls',ap:'1 halter, sentado.',st:['Sentado, cotovelo apoiado na parte interna da coxa.','Suba o halter ao ombro apertando o bíceps no topo.','Desça até esticar; troque de braço.'],er:'tirar o cotovelo da coxa; usar impulso.',alt:'Rosca inclinada, se quiser alongamento.'},
    {id:'d3b6',pq:{pra:'Posterior de coxa, que teu histórico mostra atrasado, na versão unilateral — alonga bem o posterior e ainda treina equilíbrio e glúteo. Fica no fim, como você quer a perna.',mus:'Posterior de coxa e glúteo (direta, principal); eretores e core (estabilização).',srr:'3 × 10–12, 1–2 RIR: unilateral exige equilíbrio; margem pra não perder a técnica e proteger a lombar.',dica:'Jogue o quadril pra trás (não enrole a coluna) e desça o halter até sentir o posterior esticar; suba com o quadril, não com a lombar.'},nm:S+'Stiff unilateral com halter',sets:3,reps:'10–12',rir:'1–2',rest:'90 s',an:'Stiff-Legged_Dumbbell_Deadlift',ap:'1–2 halteres, uma perna.',st:['Em pé numa perna, a outra estende pra trás como contrapeso.','Desça o halter à frente, quadril pra trás, até alongar o posterior.','Suba com o quadril, controlando o equilíbrio.'],er:'arredondar a lombar; girar o quadril.',alt:'Stiff com as duas pernas (bilateral).'}

   dia4:[
    {id:'d4b1',pq:{pra:'Peito no ângulo reto pra espessura, tríceps de brinde — empurrar alimenta teu braço. Halter desce mais fundo que a barra e poupa o ombro AC.',mus:'Peitoral (direta, principal); tríceps e deltoide anterior (direta, parcial).',srr:'3 × 8–12, 1 RIR: faixa de hipertrofia; carga que você controla sem forçar o fundo.',dica:'Cotovelos a ~45° e desça até o peito alongar; empurre controlado sem travar lá em cima.'},nm:S+'Supino reto halteres',sets:3,reps:'8–12',rir:'1',rest:'2 min',an:'Dumbbell_Bench_Press',ap:'Banco reto + 2 halteres.',st:['Cotovelos a ~45°; desça buscando alongar.','Empurre controlado sem travar.'],er:'cotovelos a 90°; descer pouco.',alt:'No chão (floor press).'},
    {id:'d4b2',pq:{pra:'Dia de maior volume de delt lateral — a largura que emoldura o físico. Estética pura, tua prioridade visual junto do braço.',mus:'Deltoide lateral (direta, principal); deltoide anterior e trapézio (indireta).',srr:'4 × 12–20, 0–1 RIR: músculo pequeno tolera volume alto perto da falha; por isso 4 séries.',dica:'Lidere com o cotovelo, suba só à altura do ombro e desça devagar pra não perder a tensão.'},nm:S+'Elevação lateral com halteres',sets:4,reps:'12–20',rir:'0–1',rest:'60 s',an:'Side_Lateral_Raise',ap:'2 halteres. Volume alto hoje.',st:['Suba até a altura do ombro; desça devagar.'],er:'usar impulso; subir acima do ombro.',alt:'Um braço de cada vez.'},
    {id:'d4b3',pq:{pra:'Único empurrar vertical da semana, leve de propósito: o delt anterior já pega bastante no supino, e overhead pesado é o que irrita teu ombro AC. Dose mínima, amplitude confortável.',mus:'Deltoide anterior (direta, principal); tríceps e deltoide lateral (direta, parcial).',srr:'2 × 10–12, 2 RIR: só 2 séries, bem longe da falha — complemento, não prato principal.',dica:'Não force a amplitude lá em cima; pare onde o ombro fica confortável. Dor no AC = troca por mais uma série de elevação lateral.'},nm:'Desenvolvimento com halteres',sets:2,reps:'10–12',rir:'2',rest:'90 s',an:'Dumbbell_Shoulder_Press',ap:'2 halteres, sentado de preferência.',st:['Halteres na altura das orelhas, cotovelos levemente à frente.','Empurre até quase esticar; desça controlado.','Amplitude confortável (não force).'],er:'arquear a lombar; forçar além do confortável.',alt:'Dor no ombro = pular e fazer mais uma de elevação lateral.'},
    {id:'d4b4',pq:{pra:'Martelo no inclinado: o braço pende atrás do corpo e alonga, somando pegada neutra (braquial) com posição esticada. Teu alvo de engrossar o braço no ângulo mais vantajoso.',mus:'Braquial e braquiorradial (direta, principal); bíceps (direta, parcial).',srr:'3 × 10–15, 0–1 RIR: reps altas perto da falha; a posição alongada pede controle.',dica:'Não adiante o cotovelo ao subir e controle a descida até esticar — o braquial castiga na negativa longa.'},nm:S+'Rosca martelo inclinada',bd:'Braquial',sets:3,reps:'10–15',rir:'0–1',rest:'60 s',an:'Incline_Hammer_Curls',ap:'Banco inclinado + halteres, pegada neutra.',st:['Braços pendem atrás do corpo (alonga).','Suba em pegada neutra, sem mexer o ombro; aperte; desça até esticar.'],er:'adiantar o cotovelo.',alt:'Martelo em pé.'},
    {id:'d4b5',pq:{pra:'Fecha o tríceps na posição curta com reps altas pra bombear o braço depois do supino, sem carga no ombro. Braço direto, teu foco.',mus:'Tríceps, cabeças lateral e medial (direta, principal); cabeça longa (direta, parcial).',srr:'3 × 12–20 até a falha: isolamento leve, pode ir ao fim.',dica:'Cotovelo alto e colado, parado; estenda até o braço reto e aperte 1 s no topo — a contração final é o que conta.'},nm:'Tríceps coice (kickback) com halter',sets:3,reps:'12–20',rir:'0',rest:'60 s',an:'Tricep_Dumbbell_Kickback',ap:'1 halter + apoio.',st:['Cotovelo alto e colado; estenda pra trás até o braço reto; aperte.','Volte devagar.'],er:'cotovelo caindo; mexer o ombro.',alt:'Dois braços apoiado no banco.'},
    {id:'d4b6',pq:{pra:'Perna do dia (distribuída, no fim). O afundo carrega quadríceps e glúteo unilateral com carga leve de halter e corrige diferença entre as pernas.',mus:'Quadríceps e glúteo (direta, principal); adutores e posterior (direta, parcial); core (estabilização).',srr:'3 × 10–12, 1 RIR: unilateral com equilíbrio, deixe margem pra manter a técnica.',dica:'Passo largo e desça até o joelho de trás quase tocar o chão; empurre pelo calcanhar da frente e não deixe o joelho cair pra dentro.'},nm:'Afundo com halteres (passada)',sets:3,reps:'10–12',rir:'1',rest:'90 s',an:'Dumbbell_Lunges',ap:'2 halteres ao lado do corpo.',st:['Dê um passo à frente e desça até o joelho de trás quase tocar o chão.','Empurre o calcanhar da frente pra voltar; alterne as pernas.'],er:'passo curto; joelho pra dentro; tronco caindo.',alt:'Afundo no lugar ou búlgaro.'},
    {id:'d4b7',pq:{pra:'Com o joelho dobrado, pega o sóleo (embaixo do gastrocnêmio, dá grossura lateral). Complementa a panturrilha em pé. Você costuma pular — por isso insisto.',mus:'Sóleo (direta, principal); gastrocnêmio (direta, parcial).',srr:'3 × 12–15 até a falha: sóleo é cheio de fibra lenta, aguenta reps e volume.',dica:'Alongue bem embaixo com pausa de 1 s e suba o mais alto que der; amplitude total vale mais que quicar com peso.'},nm:'Panturrilha sentado com halter',sets:3,reps:'12–15',rir:'0',rest:'60 s',an:'Dumbbell_Seated_One-Leg_Calf_Raise',ap:'1 halter sobre a coxa, sentado.',st:['Halter sobre o joelho, ponta do pé num apoio.','Desça o calcanhar até alongar (pausa 1 s); suba na ponta.'],er:'quicar.',alt:'Uma perna de cada vez.'}

   dia5:[
    {id:'d5b1',pq:{pra:'Dia de bombear: o crucifixo isola o peito na posição alongada (braços abertos), a que mais cresce, sem o tríceps entrar. Fecha a semana de peito sem estressar o ombro.',mus:'Peitoral (direta, principal); deltoide anterior (direta, parcial).',srr:'3 × 12–15, 0–1 RIR: isolamento de bombeamento, reps altas perto da falha.',dica:'Abra até sentir o peito esticar (sem forçar atrás da linha do ombro, pelo AC) e feche sem socar os halteres — aperte 1 s.'},nm:S+'Crucifixo com halteres',sets:3,reps:'12–15',rir:'0–1',rest:'60 s',an:'Dumbbell_Flyes',ap:'Banco reto + 2 halteres.',st:['Braços quase estendidos sobre o peito, leve flexão de cotovelo.','Abra pros lados até alongar o peito.','Feche sem socar; aperte 1 s.'],er:'dobrar muito o cotovelo (vira supino).',alt:'No banco inclinado, pra parte alta do peito.'},
    {id:'d5b2',pq:{pra:'Mais volume de costas pra fechar a semana, com bíceps indireto. Espessura é o par da largura que você treina na puxada.',mus:'Dorsal, trapézio médio e romboides (direta, principal); bíceps e braquial (indireta); eretores (estabilização).',srr:'3 × 10–15, 1 RIR: hipertrofia com reps médias-altas no fim do treino.',dica:'Trave o tronco inclinado e puxe os cotovelos pra trás; se o tronco sobe junto, baixe a carga.'},nm:'Remada com 2 halteres',sets:3,reps:'10–15',rir:'1',rest:'75 s',an:'Bent_Over_Two-Dumbbell_Row',ap:'2 halteres.',st:['Tronco inclinado firme; puxe os halteres aos quadris.','Aperte as escápulas; desça controlado.'],er:'arredondar a lombar.',alt:'Peito apoiado no banco inclinado.'},
    {id:'d5b3',pq:{pra:'Mais largura de ombro em reps altas de bombeamento. Terceira dose de delt lateral na semana porque é prioridade estética e aguenta volume.',mus:'Deltoide lateral (direta, principal); deltoide anterior e trapézio (indireta).',srr:'3 × 15–20, 0–1 RIR: reps altas pra encher o ombro, perto da falha.',dica:'Lidere com o cotovelo, suba só à altura do ombro e desça devagar.'},nm:S+'Elevação lateral com halteres',sets:3,reps:'15–20',rir:'0–1',rest:'60 s',an:'Side_Lateral_Raise',ap:'2 halteres.',st:['Suba até a altura do ombro; desça devagar.'],er:'impulso.',alt:'Um braço de cada vez.'},
    {id:'d5b4',pq:{pra:'Delt posterior, o lado escondido que dá o ombro redondo de perfil e equilibra o empurrar — estética e saúde de ombro juntas.',mus:'Deltoide posterior (direta, principal); trapézio médio e romboides (direta, parcial).',srr:'3 × 15–20 até a falha: músculo postural, reps altas e contração mantida.',dica:'Abra levando os cotovelos pra trás e pra fora; se puxar ao quadril, vira remada e a dorsal rouba.'},nm:'Crucifixo inverso com halteres',sets:3,reps:'15–20',rir:'0',rest:'60 s',an:'Reverse_Flyes',ap:'2 halteres, tronco à frente.',st:['Abra levando os cotovelos pra trás/fora até a linha dos ombros.','Aperte o posterior; volte controlado.'],er:'usar a dorsal; balançar.',alt:'Peito apoiado no banco inclinado.'},
    {id:'d5b5',pq:{pra:'Fecha o braço do dia no braquial — teu alvo pra engrossar o braço — com pegada neutra. Entrou no lugar do Zottman, que você não curtiu; versão com halteres pro dia só-halteres.',mus:'Braquial e braquiorradial (direta, principal); bíceps (direta, parcial).',srr:'3 × 10–15 até a falha: músculo pequeno e resistente, reps altas perto da falha pra finalizar o braço.',dica:'Polegar pra cima o tempo todo e cotovelo parado ao lado do corpo; controle a descida até esticar — o braquial gosta da negativa.'},nm:'Rosca martelo com halteres',bd:'Braquial',sets:3,reps:'10–15',rir:'0',rest:'60 s',an:'Hammer_Curls',ap:'2 halteres, pegada neutra (palmas frente a frente).',st:['Polegar pra cima (pegada de martelo), cotovelos colados ao corpo.','Suba mantendo a pegada neutra, sem balançar o tronco.','Aperte em cima; desça controlado até esticar.'],er:'girar o punho; usar impulso.',alt:'Martelo cruzado (cross-body), pra variar o ângulo.'},

  var KEY='treinoLogV3';

  function loadSynced(){try{return JSON.parse(localStorage.getItem(SKEY))||[];}catch(e){return[];}}
  function saveSynced(a){try{localStorage.setItem(SKEY,JSON.stringify(a));}catch(e){}}
  function isSynced(ts){return loadSynced().indexOf(ts)>=0;}
  function markSynced(ts){var a=loadSynced();if(a.indexOf(ts)<0){a.push(ts);saveSynced(a);}}
  function unmarkSynced(ts){saveSynced(loadSynced().filter(function(x){return x!==ts;}));}
  function stripStar(s){return s.replace(/<[^>]+>/g,'').replace('★','').trim();}
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':'&gt;';});}
  function parseDate(s){var m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((s||'').trim());if(!m)return null;var d=new Date(+m[3],+m[2]-1,+m[1],12,0,0);return isNaN(d.getTime())?null:d;}
  function fmtDate(d){var p=function(n){return(n<10?'0':'')+n;};return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();}

  // ---- Sugestão de carga: aprende do histórico logado (dupla progressão) ----
  function logSorted(){return loadLog().slice().sort(function(a,b){return a.ts-b.ts;});}
  function repRange(r){var m=String(r||'').match(/(\d+)\s*[–\-]\s*(\d+)/);if(m)return{lo:+m[1],hi:+m[2]};var s=String(r||'').match(/^\s*(\d+)\s*$/);if(s)return{lo:+s[1],hi:+s[1]};return null;}
  function hasSets(e){return e&&e.sets&&e.sets.some(function(s){return s.reps!=null||s.kg!=null;});}
  function topSet(sets){var best=null;(sets||[]).forEach(function(s){if(s.reps==null&&s.kg==null)return;if(!best){best=s;return;}var bk=(best.kg==null?-1:best.kg),sk=(s.kg==null?-1:s.kg);if(sk>bk||(sk===bk&&(s.reps||0)>(best.reps||0)))best=s;});return best;}
  function lastEntryFor(exId){var log=logSorted();for(var i=log.length-1;i>=0;i--){var e=log[i].entries&&log[i].entries[exId];if(hasSets(e))return{entry:e,date:log[i].date};}return null;}
  // ---- Ponte entre planos (v1/v2/v3 no MESMO origin): liga o mesmo exercício pelo NOME, já que os IDs mudam de plano pra plano ----
  function normNm(s){s=stripStar(String(s||'')).toLowerCase();try{s=s.normalize('NFD').replace(/[̀-ͯ]/g,'');}catch(e){}return s.replace(/\([^)]*\)/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
  var OLDLOGS=[{k:'treinoLogV2',plan:'v2'},{k:'treinoLog_v1',plan:'v1'}]; // mais novo primeiro
  function loadOldLog(k){try{return JSON.parse(localStorage.getItem(k))||[];}catch(e){return[];}}
  function scanByName(arr,tn){for(var i=arr.length-1;i>=0;i--){var E=arr[i].entries||{};for(var id in E){if(E.hasOwnProperty(id)&&hasSets(E[id])&&normNm(E[id].nm)===tn)return{entry:E[id],date:arr[i].date};}}return null;}
  function directHit(exId){
    var tn=normNm((byId[exId]||{}).nm), v3=logSorted();
    for(var i=v3.length-1;i>=0;i--){var s=v3[i],E=s.entries||{};
      if(hasSets(E[exId]))return{entry:E[exId],date:s.date,plan:'v3'};
      if(tn){for(var id in E){if(E.hasOwnProperty(id)&&hasSets(E[id])&&normNm(E[id].nm)===tn)return{entry:E[id],date:s.date,plan:'v3'};}}
    }
    if(!tn)return null;
    for(var p=0;p<OLDLOGS.length;p++){var arr=loadOldLog(OLDLOGS[p].k).slice().sort(function(a,b){return a.ts-b.ts;});var r=scanByName(arr,tn);if(r)return{entry:r.entry,date:r.date,plan:OLDLOGS[p].plan};}
    return null;
  }
  // similar = mesmo movimento (mesmo 'an'); ponte extra p/ a família do martelo (cabo/halter/inclinada/cross-body)
  var SIMAN={'Cable_Hammer_Curls_-_Rope_Attachment':['Hammer_Curls','Incline_Hammer_Curls','Cross_Body_Hammer_Curl'],'Hammer_Curls':['Cable_Hammer_Curls_-_Rope_Attachment','Incline_Hammer_Curls','Cross_Body_Hammer_Curl'],'Incline_Hammer_Curls':['Hammer_Curls','Cross_Body_Hammer_Curl'],'Cross_Body_Hammer_Curl':['Hammer_Curls','Incline_Hammer_Curls']};
  function similarLast(exId){
    var an=(byId[exId]||{}).an; if(!an)return null;
    var ans={}; ans[an]=1; (SIMAN[an]||[]).forEach(function(a){ans[a]=1;});
    var ids=Object.keys(byId).filter(function(id){return id!==exId&&ans[(byId[id]||{}).an];});
    var log=logSorted();
    for(var i=log.length-1;i>=0;i--){for(var j=0;j<ids.length;j++){var e=log[i].entries&&log[i].entries[ids[j]];if(hasSets(e))return{entry:e,date:log[i].date,nm:(byId[ids[j]]||{}).nm||ids[j]};}}
    return null;
  }
  function round05(x){return Math.round(x*2)/2;}
  function suggestFor(exId){
    var meta=byId[exId]||{}, rng=repRange(meta.reps);
    var hit=directHit(exId), sim=false, srcNm=null, plan=(hit&&hit.plan)||'v3';
    if(!hit){var r=similarLast(exId); if(r){hit={entry:r.entry,date:r.date}; sim=true; plan='v3'; srcNm=stripStar(r.nm);}}
    if(!hit)return {none:true};
    var e=hit.entry, unit=(e.unit||'kg'), un=(unit==='placas'?'pl':'kg'), top=topSet(e.sets);
    if(!top)return {none:true};
    var bw=(top.kg===0||top.kg==null);
    var lastStr=(top.reps==null?'–':top.reps)+(bw?' reps':('×'+top.kg+un));
    var advice, sugKg=null;
    if(bw){ advice='+1–2 reps'; }
    else if(rng&&top.reps!=null&&top.reps>=rng.hi){ var step=(unit==='placas')?1:(rng.hi<=10?4:2); sugKg=round05(top.kg+step); advice='subir p/ <b>'+sugKg+un+'</b> ↑'; }
    else if(rng&&top.reps!=null&&top.reps<rng.lo){ sugKg=top.kg; advice='repetir <b>'+top.kg+un+'</b> (fechar '+rng.lo+')'; }
    else { sugKg=top.kg; advice='manter <b>'+top.kg+un+'</b>, +reps'; }
    return {none:false, sim:sim, plan:plan, srcNm:srcNm, lastStr:lastStr, date:hit.date, advice:advice, sugKg:sugKg, unit:unit};
  }

  function loadAnim(box){
    if(box.getAttribute('data-loaded'))return;
    box.setAttribute('data-loaded','1');
    var an=box.getAttribute('data-an'), holder=box.querySelector('.anim'), MAXF=8, frames=[];
    function finish(){
      var l=holder.querySelector('.anim__loading'); if(l)l.remove();
      if(!frames.length){ holder.innerHTML='<div class="anim__loading">animação indisponível</div>'; return; }
      frames.forEach(function(im,i){ im.className='af'; im.style.opacity=(i===0?'1':'0'); holder.appendChild(im); });
      if(frames.length>1){
        var i=0;
        box._anim=setInterval(function(){
          frames[i].style.opacity='0';
          i=(i+1)%frames.length;
          frames[i].style.opacity='1';
        }, frames.length>2?620:700);
      }
    }
    // detecta quantos quadros existem (0.jpg, 1.jpg, 2.jpg…) carregando em sequência
    function probe(k){
      if(k>=MAXF){finish();return;}
      var im=new Image(); im.alt='';
      im.onload=function(){ frames.push(im); probe(k+1); };
      im.onerror=function(){ finish(); };
      im.src=IMG+an+'/'+k+'.jpg';
    }
    probe(0);
  }
