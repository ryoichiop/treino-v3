      '<span class="fld"><input class="in in-kg" type="number" inputmode="decimal" min="0" step="0.5" placeholder="'+kph+'" value="'+kv+'" aria-label="carga série '+n+'"><span class="u">'+ulab+'</span></span></div>';
  }
  function addRow(rowsEl){var n=rowsEl.children.length+1;var ex=rowsEl.closest('.ex');var unit=(ex&&ex.getAttribute('data-unit'))||'kg';var first=rowsEl.querySelector('.in-kg');var ph=first?first.getAttribute('placeholder'):null;var w=document.createElement('div');w.innerHTML=setRow(n,null,null,ph,unit);rowsEl.appendChild(w.firstChild);}
  function setUnit(btn){
    var ex=btn.closest('.ex'), unit=btn.getAttribute('data-u');
    ex.setAttribute('data-unit',unit);
    [].slice.call(ex.querySelectorAll('.unitseg .us')).forEach(function(b){b.classList.toggle('is-active',b===btn);});
    [].slice.call(ex.querySelectorAll('.in-kg')).forEach(function(inp){inp.setAttribute('placeholder',unit==='placas'?'placas':'kg');});
    [].slice.call(ex.querySelectorAll('.setrow .u')).forEach(function(s){s.textContent=unit==='placas'?'pl':'kg';});
  }

  function switchMode(btn){
    var mode=btn.getAttribute('data-mode'), panel=btn.closest('.panel'), dayId=panel.getAttribute('data-panel');
    if(activeDay===dayId){toast('Salve ou cancele o treino antes de trocar o modo');return;}
    var day=DAYS.filter(function(x){return x.id===dayId;})[0]; if(!day)return;
    [].slice.call(panel.querySelectorAll('.mode')).forEach(function(b){b.classList.toggle('is-active',b===btn);});
    dayMode[dayId]=mode;
    panel.querySelector('.exwrap').innerHTML=(mode==='db'?day.exDB:day.ex).map(exHtml).join('');
    refreshSuggestions(panel);
  }
  function startSession(dayId){
    activeDay=dayId;
    var panel=panels[dayId];
    [].slice.call(panel.querySelectorAll('.ex')).forEach(function(ex){
      var n=parseInt(ex.getAttribute('data-sets'),10)||3;
      var log=ex.querySelector('.ex__log');
      var sug=suggestFor(ex.getAttribute('data-id'));
      var unit=(sug&&!sug.none&&sug.unit)?sug.unit:'kg';
      var ph=(sug&&!sug.none&&sug.sugKg!=null)?String(sug.sugKg):'';
      var rows='';for(var i=1;i<=n;i++)rows+=setRow(i,null,null,ph,unit);
      var kgA=(unit==='kg'?' is-active':''), plA=(unit==='placas'?' is-active':'');
      log.innerHTML='<div class="loghead"><span>Registro de hoje — reps × carga</span><span class="unitseg"><button type="button" class="us'+kgA+'" data-u="kg">kg</button><button type="button" class="us'+plA+'" data-u="placas">placas</button></span></div><div class="rows">'+rows+'</div><button class="addset" type="button">+ série</button><textarea class="in-obs" rows="2" placeholder="observações sobre esse exercício (opcional)…"></textarea>';
      log.removeAttribute('hidden'); ex.classList.add('logging'); ex.setAttribute('data-unit',unit);
    });
    var btn=panel.querySelector('[data-start]'); btn.textContent='Treino em andamento…'; btn.disabled=true; btn.style.opacity='.6';
    document.getElementById('savebar').hidden=false;
    document.getElementById('saveinfo').textContent=panel.querySelector('h2').textContent.trim();
    toast('Treino iniciado — registre as séries');
  }
  function collect(dayId){
    var panel=panels[dayId], entries={};
    [].slice.call(panel.querySelectorAll('.ex')).forEach(function(ex){
      var id=ex.getAttribute('data-id'), sets=[];
      [].slice.call(ex.querySelectorAll('.setrow')).forEach(function(r){
        var reps=r.querySelector('.in-reps').value.trim(), kg=r.querySelector('.in-kg').value.trim();
        if(reps!==''||kg!=='')sets.push({reps:reps===''?null:Number(reps),kg:kg===''?null:Number(kg)});
      });
      var obsEl=ex.querySelector('.in-obs');
      entries[id]={nm:stripStar(byId[id].nm),sets:sets,obs:obsEl?obsEl.value.trim():'',unit:(ex.getAttribute('data-unit')||'kg')};
    });
    return entries;
  }
  document.getElementById('btnSave').addEventListener('click',function(){
    if(!activeDay)return;
    var d=new Date(), day=DAYS.filter(function(x){return x.id===activeDay;})[0];
    var sess={ts:d.getTime(),date:fmtDate(d),dayId:activeDay,dayName:day.name,variant:(dayMode[activeDay]||'full'),entries:collect(activeDay)};
    var log=loadLog(); log.push(sess); saveLog(log);
    syncSession(sess); endSession(); refreshSuggestions(); toast('Treino salvo ✓'); show('hist');
  });
  document.getElementById('btnCancel').addEventListener('click',function(){endSession();toast('Cancelado');});
  function endSession(){
    if(!activeDay)return;
    var panel=panels[activeDay];
    [].slice.call(panel.querySelectorAll('.ex')).forEach(function(ex){ex.classList.remove('logging');var log=ex.querySelector('.ex__log');log.innerHTML='';log.setAttribute('hidden','');});
    var btn=panel.querySelector('[data-start]'); btn.textContent='▶ Iniciar treino'; btn.disabled=false; btn.style.opacity='';
    document.getElementById('savebar').hidden=true; activeDay=null;
  }

  function postSync(payload){ if(!SYNC_URL)return Promise.reject(); try{ return fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); }catch(e){ return Promise.reject(e); } }
  function buildPayload(sess){
    var day=DAYS.filter(function(d){return d.id===sess.dayId;})[0];
    var list=day?(sess.variant==='db'&&day.exDB?day.exDB:day.ex):[];
    var rows=[];
    list.forEach(function(ex){
      var e=sess.entries[ex.id]||{nm:stripStar(ex.nm),sets:[],obs:''};
      var nm=stripStar(e.nm||ex.nm);
      var uTag=(e.unit==='placas'?'[placas] ':'');
      if(!e.sets||!e.sets.length){ rows.push({exId:ex.id,exercicio:nm,serie:0,reps:'',carga:'',obs:uTag+(e.obs||'')}); }
      else e.sets.forEach(function(s,i){ rows.push({exId:ex.id,exercicio:nm,serie:i+1,reps:(s.reps==null?'':s.reps),carga:(s.kg==null?'':s.kg),obs:(i===0?uTag+(e.obs||''):'')}); });
    });
    return {key:SYNC_KEY,ts:sess.ts,savedAt:new Date().toISOString(),date:sess.date,dia:sess.dayId,diaNome:sess.dayName,modo:(sess.variant||'full'),rows:rows};
  }
  function syncSession(sess){
    if(!SYNC_URL)return;
    postSync(buildPayload(sess)).then(function(){ markSynced(sess.ts); refreshSyncBadges(); }).catch(function(){ refreshSyncBadges(); });
  }
  function refreshSyncBadges(){
    [].slice.call(document.querySelectorAll('.sess[data-ts]')).forEach(function(card){
      var ts=Number(card.getAttribute('data-ts')), b=card.querySelector('.syncbadge'); if(!b)return;
      var ok=isSynced(ts);
      b.textContent=ok?'✓ sincronizado':'⏳ pendente';
      b.className='syncbadge '+(ok?'is-ok':'is-pending');
    });
  }
  function flushPending(){
    if(!SYNC_URL)return;
    var synced=loadSynced();
    loadLog().forEach(function(sess){
      if(synced.indexOf(sess.ts)<0){ postSync(buildPayload(sess)).then(function(){ markSynced(sess.ts); refreshSyncBadges(); }).catch(function(){}); }
    });
  }
  function syncDelete(ts){ unmarkSynced(ts); if(SYNC_URL){ postSync({key:SYNC_KEY,ts:ts,rows:[]}).catch(function(){}); } }
  function sessLine(e){
    var obs=e.obs?' <span class="obsnote">— '+esc(e.obs)+'</span>':'';
    if(!e.sets.length)return '<div class="sess__line"><span class="exn">'+esc(e.nm)+':</span> <span class="sk">— não feito</span>'+obs+'</div>';
    var un=(e.unit==='placas'?' pl':'kg');
    var parts=e.sets.map(function(s){var r=(s.reps==null?'–':s.reps);var k=(s.kg==null?'–':(s.kg===0?'PC':s.kg+un));return r+'×'+k;});
    return '<div class="sess__line"><span class="exn">'+esc(e.nm)+':</span> '+parts.join(', ')+obs+'</div>';
  }
  function renderHist(){
    var log=loadLog().slice().sort(function(a,b){return b.ts-a.ts;});
    var h='<div class="histhead"><h2>Histórico</h2><button class="btn" id="btnCopy">Copiar resumo</button><button class="btn" id="btnDl">Baixar JSON</button></div>';
    if(!log.length){h+='<p class="empty">Nenhum treino registrado ainda. Vá num dia, aperte ▶ Iniciar treino e salve.</p>';}
    else{
      h+=log.map(function(s){
        var day=DAYS.filter(function(d){return d.id===s.dayId;})[0];
        var list=day?(s.variant==='db'&&day.exDB?day.exDB:day.ex):[];
        var lines=list.map(function(ex){var e=s.entries[ex.id]||{nm:stripStar(ex.nm),sets:[]};return sessLine(e);}).join('');
        var tag=(s.variant==='db'?' · só halteres':'');
        return '<div class="sess" data-ts="'+s.ts+'"><div class="sess__top"><span class="sess__date">'+esc(s.date)+'</span><span class="sess__day">'+esc(s.dayName)+tag+'</span><span class="syncbadge '+(isSynced(s.ts)?'is-ok':'is-pending')+'">'+(isSynced(s.ts)?'✓ sincronizado':'⏳ pendente')+'</span><button class="sess__edit" data-edit="'+s.ts+'">editar</button><button class="sess__del" data-del="'+s.ts+'">excluir</button></div><div class="sess__body">'+lines+'</div></div>';
      }).join('');
    }
    panels.hist.innerHTML=h;
    var c=document.getElementById('btnCopy'); if(c)c.addEventListener('click',copyAll);
    var dl=document.getElementById('btnDl'); if(dl)dl.addEventListener('click',downloadJSON);
    [].slice.call(panels.hist.querySelectorAll('[data-del]')).forEach(function(b){b.addEventListener('click',function(){
      var dts=Number(b.getAttribute('data-del')); saveLog(loadLog().filter(function(x){return x.ts!==dts;})); syncDelete(dts); renderHist();
    });});
  }
  function editSession(ts){
    var log=loadLog(), s=log.filter(function(x){return x.ts===ts;})[0]; if(!s)return;
    var day=DAYS.filter(function(d){return d.id===s.dayId;})[0];
    var card=panels.hist.querySelector('.sess[data-ts="'+ts+'"]'); if(!card)return;
    var body=card.querySelector('.sess__body'); if(!body)return;
    var list=(day?(s.variant==='db'&&day.exDB?day.exDB:day.ex):Object.keys(s.entries).map(function(id){return {id:id,nm:(s.entries[id].nm||id)};}));
    var forms=list.map(function(ex){
      var e=s.entries[ex.id]||{sets:[],obs:''};
      var sets=(e.sets&&e.sets.length)?e.sets:[{reps:null,kg:null}];
      var rows=sets.map(function(st,i){return setRow(i+1,st.reps,st.kg);}).join('');
      return '<div class="ex-edit" data-id="'+ex.id+'"><div class="ee__name">'+esc(stripStar(ex.nm))+'</div>'+
        '<div class="rows">'+rows+'</div><button class="addset" type="button">+ série</button>'+
        '<textarea class="in-obs" rows="2" placeholder="observações…">'+esc(e.obs||'')+'</textarea></div>';
    }).join('');
    body.innerHTML='<label class="ee__datelbl">Data<input class="ee__date" value="'+esc(s.date)+'" placeholder="dd/mm/aaaa"></label>'+forms+
      '<div class="ee__actions"><button class="btn" data-editcancel="'+ts+'">Cancelar</button><button class="btn btn-save" data-editsave="'+ts+'">Salvar alterações</button></div>';
    try{card.scrollIntoView({block:'start'});}catch(e){}
  }
  function saveEdit(ts){
    var log=loadLog(), idx=-1; log.forEach(function(x,i){if(x.ts===ts)idx=i;}); if(idx<0)return;
    var card=panels.hist.querySelector('.sess[data-ts="'+ts+'"]'); if(!card)return;
    var s=log[idx], entries={};
    [].slice.call(card.querySelectorAll('.ex-edit')).forEach(function(ee){
      var id=ee.getAttribute('data-id'), sets=[];
      [].slice.call(ee.querySelectorAll('.setrow')).forEach(function(r){
        var reps=r.querySelector('.in-reps').value.trim(), kg=r.querySelector('.in-kg').value.trim();
        if(reps!==''||kg!=='')sets.push({reps:reps===''?null:Number(reps),kg:kg===''?null:Number(kg)});
      });
      var obsEl=ee.querySelector('.in-obs');
      entries[id]={nm:stripStar((byId[id]&&byId[id].nm)||(s.entries[id]&&s.entries[id].nm)||id),sets:sets,obs:obsEl?obsEl.value.trim():'',unit:((s.entries[id]&&s.entries[id].unit)||'kg')};
    });
    s.entries=entries;
    var de=card.querySelector('.ee__date'); if(de){var pd=parseDate(de.value); if(pd){s.date=fmtDate(pd); s.ts=pd.getTime();}}
    saveLog(log); unmarkSynced(s.ts); syncSession(s); refreshSuggestions(); toast('Alterações salvas ✓'); renderHist();
  }
  function summaryText(){
    var log=loadLog().slice().sort(function(a,b){return a.ts-b.ts;});
    var out='=== TREINO v3 — HISTÓRICO ===\n';
    log.forEach(function(s){
      out+='\n'+s.date+' — '+s.dayName+(s.variant==='db'?' (só halteres)':'')+'\n';
      var day=DAYS.filter(function(d){return d.id===s.dayId;})[0];
      var list=day?(s.variant==='db'&&day.exDB?day.exDB:day.ex):[];
      list.forEach(function(ex){
        var e=s.entries[ex.id]||{nm:stripStar(ex.nm),sets:[]};
        var ob=e.obs?'  [obs: '+e.obs+']':'';
        if(!e.sets.length){out+='  - '+e.nm+': — nao feito'+ob+'\n';}
        else{out+='  - '+e.nm+': '+e.sets.map(function(x){var r=(x.reps==null?'-':x.reps);var k=(x.kg==null?'-':(x.kg===0?'PC':x.kg+'kg'));return r+'x'+k;}).join(', ')+ob+'\n';}
      });
    });
    return out;
  }
  function copyAll(){
    var txt=summaryText();
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('Resumo copiado ✓');},function(){showModal(txt);});}
    else showModal(txt);
  }
  function downloadJSON(){
    try{
      var blob=new Blob([JSON.stringify(loadLog(),null,2)],{type:'application/json'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='treino-v3-log.json'; document.body.appendChild(a); a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},100); toast('Baixando JSON…');
    }catch(e){showModal(JSON.stringify(loadLog(),null,2));}
  }

  var toastEl=document.getElementById('toast'),tmr;
  function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tmr);tmr=setTimeout(function(){toastEl.classList.remove('show');},1800);}
  var modal=document.getElementById('modal'),modalTxt=document.getElementById('modalTxt');
  function showModal(t){modalTxt.value=t;modal.classList.add('show');modalTxt.focus();modalTxt.select();}
  document.getElementById('modalClose').addEventListener('click',function(){modal.classList.remove('show');});
  modal.addEventListener('click',function(e){if(e.target===modal)modal.classList.remove('show');});

  show('inicio');
  flushPending();
})();
</script>
</body>
</html>
